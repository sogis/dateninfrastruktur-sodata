spring:
  application:
    name: dateninfrastruktur-sodata
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      whitelabel:
        enabled: false

server:
  server-header: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,catalog
    info:
      enabled: true
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: false
  health:
    diskspace:
      enabled: false

dateninfrastruktur:
  web-components:
    enabled: true
    version: "0.1.10"
    asset-base-path: "/vendor/so-web-components/0.1.10"
    use-cdn: false

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true
