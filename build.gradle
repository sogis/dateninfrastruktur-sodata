plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.14'
    id 'gg.jte.gradle' version '3.2.4'
}

graalvmNative {
    binaries {
        main {
            // Deploy the same image on nodes with different CPU feature sets.
            buildArgs.add('-march=compatibility')
        }
    }
}

group = 'ch.so.agi'
description = 'Datenportal Webanwendung Kanton Solothurn'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    playwrightVersion = '1.60.0'
}

def gitCommit = 'unknown'
try {
    def gitDir = file('.git')
    def headFile = new File(gitDir, 'HEAD')
    if (headFile.exists()) {
        def head = headFile.text.trim()
        if (head.startsWith('ref: ')) {
            def ref = head.substring(5)
            def refFile = new File(gitDir, ref)
            if (refFile.exists()) {
                def resolvedGitCommit = refFile.text.trim()
                if (resolvedGitCommit) {
                    gitCommit = resolvedGitCommit.take(12)
                }
            } else {
                def packedRefsFile = new File(gitDir, 'packed-refs')
                if (packedRefsFile.exists()) {
                    def packedRefLine = packedRefsFile.readLines().find { line ->
                        !line.startsWith('#') && !line.startsWith('^') && line.endsWith(" ${ref}")
                    }
                    if (packedRefLine) {
                        gitCommit = packedRefLine.tokenize(' ')[0].take(12)
                    }
                }
            }
        } else if (head) {
            gitCommit = head.take(12)
        }
    }
} catch (Exception ignored) {
}

// Container-Builds kopieren kein .git; der Commit kann per -PgitCommit uebergeben werden.
if (project.hasProperty('gitCommit') && project.gitCommit.toString().isBlank() == false) {
    gitCommit = project.gitCommit.toString()
}

def gitCommitProvider = providers.provider {
    gitCommit
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'
    implementation 'org.commonmark:commonmark:0.30.0'


    testImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

def playwrightBrowsersPath = layout.projectDirectory.dir('.gradle/playwright-browsers').asFile.absolutePath
def playwrightInstallWithDeps = providers.gradleProperty('dateninfrastruktur.playwright.withDeps')
        .getOrElse('false')
        .toBoolean()

def playwrightInstallArgs = { String browser ->
    def args = ['install']
    if (playwrightInstallWithDeps) {
        args << '--with-deps'
    }
    args << browser
    args
}

tasks.register('installPlaywrightChromium', JavaExec) {
    group = 'verification'
    description = 'Installs the Chromium browser used by Playwright tests, optionally with system dependencies.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args playwrightInstallArgs('chromium')
    environment 'PLAYWRIGHT_BROWSERS_PATH', playwrightBrowsersPath
}

jte {
    generate()
    binaryStaticContent = true
}

springBoot {
    buildInfo {
        properties {
            additional = [
                'commit': gitCommitProvider
            ]
        }
    }
}

tasks.named('wrapper') {
    gradleVersion = '9.5.1'
    distributionType = Wrapper.DistributionType.BIN
}
// These suites require an explicitly owned primary PostgreSQL runtime.
tasks.named('test') { exclude '**/*IT.class' }
tasks.register('managementDatabaseTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    environment 'PLAYWRIGHT_SKIP_BROWSER_GC', '1'
}
